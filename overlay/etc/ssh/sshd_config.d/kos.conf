# KOS: login keys come only from kos.conf's ssh_key= lines, which kos-config (every boot) and kos-ssh-key write into
# this root-owned file; removing a line revokes the key. ~/.ssh/authorized_keys is not read, so ssh-copy-id does nothing.
AuthorizedKeysFile /etc/kos/authorized_keys/%u
PermitRootLogin no
# IPv6 is off (ipv6.disable=1 on the kernel command line).
AddressFamily inet
# No tunnels or forwarding: a key holder could otherwise reach Moonraker on 127.0.0.1:7125 past nginx's Host/Origin
# checks (docs/plan.md §11). Login shells and scp/sftp are unaffected.
AllowTcpForwarding no
X11Forwarding no
AllowAgentForwarding no
AllowStreamLocalForwarding no
PermitTunnel no
