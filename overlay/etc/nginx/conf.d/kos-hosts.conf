# Against DNS rebinding and cross-site requests from web pages (docs/plan.md §11). kos-config writes the name list,
# /etc/kos/nginx-hosts.map at every boot: localhost, the hostname, <hostname>.local and kos.conf's allowed_hosts=.
# Room for a 253-character name in one hash bucket (the default, 32 or 64 bytes, fits only short ones).
map_hash_bucket_size 512;
# Host: an IPv4 address or a listed name, else 421 (whole site).
map $host $kos_host_ok {
    default 0;
    "~^\d{1,3}(\.\d{1,3}){3}$" 1;
    include /etc/kos/nginx-hosts.map;
}
# Origin, on the API and websocket: absent (slicers, curl), the page's own address, or a listed name, else 403.
map "$http_origin|$http_host" $kos_same_origin {
    default 0;
    "~^\|" 1;
    "~*^https?://([^/|]+)\|\1$" 1;
}
map $http_origin $kos_origin_host {
    default "";
    "~*^https?://(?<h>[^/:|]+)(:\d+)?$" $h;
}
map $kos_origin_host $kos_origin_listed {
    default 0;
    include /etc/kos/nginx-hosts.map;
}
map "$kos_same_origin$kos_origin_listed" $kos_origin_ok {
    default 1;
    00 0;
}
