# KOS provisioning file. Edit from any computer before first boot; re-read on every boot.
# Format: key=value, one per line. Unknown keys are ignored. Quotes are not needed.
# A '#' starts a comment only at the start of a line: "password=a #b" sets the password "a #b".
# A line ending in '\' continues on the next line (joined with one space). A comment line or a new key= ends it.
# Problems found at boot (a bad value, an invalid key) are listed in KOS-WARNINGS.txt next to this file.

# Hostname: letters, digits and '-'. The printer is reachable at http://<hostname>.local
hostname=kos

# The web UI and slicers answer only to the hostname, <hostname>.local and IP addresses (protection against
# web pages that try to reach the printer through your browser). Add other names you use for it, such as a DNS name
# from your router, separated by spaces or commas.
# allowed_hosts=voron.lan printer.home.arpa

# Login. User is always "klipper". This file is the only source of SSH keys and of the password: remove a line
# and that key or password stops working on the next boot. ssh-copy-id does not work; on the printer,
# "kos-ssh-key add|list|remove" edits the ssh_key= lines here and applies them at once.
# No password= (or an empty one): password login is off everywhere (SSH, serial console). tty1 logs in by itself.
# password=
# One key per ssh_key= line, as many lines as you like:
# ssh_key=ssh-ed25519 AAAA... you@laptop
# ssh_key=ssh-ed25519 AAAA... you@desktop
# or several keys in one value, continued with '\' (putting '#' in front of a line removes that key):
# ssh_key=ssh-ed25519 AAAA... you@laptop \
#         ssh-ed25519 AAAA... you@desktop
# Plain keys only: a key with options (from=, command=, restrict ...) or a certificate is refused, with a warning.

# Wi-Fi. Wired ethernet needs nothing.
# wifi_ssid=
# wifi_pass=
# wifi_country=US

# Timezone, e.g. America/Chicago, Europe/Berlin, Etc/UTC
timezone=Etc/UTC

# CAN bus bitrate for toolhead boards. Must match the firmware on the toolhead: 1000000, 500000, 250000
can_bitrate=1000000

# MCU pinning. Normally auto-detected on boot. Set these only when discovery reports an ambiguity
# (see MCU-DISCOVERY.txt next to this file).
# main_mcu_serial=/dev/serial/by-id/usb-Klipper_stm32h723xx_...-if00
# toolhead_uuid=0123456789ab

# Display: none | hdmi. "none" keeps the GPU/HDMI drivers unloaded (saves RAM on CB1).
display=none

# --- Raspberry Pi CM5 on a CM4-style carrier board (BTT Manta M5P / M8P and similar) ---
# Ignored on CB1 and Pi 4 / CM4. Changes take effect on the boot after the one that reads them.
# CM4-style carrier device tree (every current Klipper carrier, BTT Manta included). Active from the first boot;
# config.txt picks the Lite or eMMC tree. Set off only for Raspberry Pi's own CM5 IO board. on | off
carrier_dt=on
# Linux console and login on GPIO14/15 (the Manta's USB-C "UART to USB" port, slide switch toward the board edge). on | off
serial_console=on
# Keep the SD card at 3.3 V (no UHS-I 1.8 V modes). on | off
# Turn this on only if the printer hangs on "reboot" (ACT LED solid green, power cycle needed) but cold boots fine.
# Carriers like the Mantas never cut the SD card's power, so a card left in 1.8 V mode by Linux cannot be read again
# after a warm reset; some cards cope, some do not. Cost: the card bus drops from 200 MHz to 50 MHz (reads about
# 22 MB/s instead of several times that), so boots and large file transfers are noticeably slower.
sd_3v3_only=off

# Archive printed gcode files out of the gcodes root (PLAN §17). on | off
archive_printed=on
archive_path=Printed/{year}/{month}/

# --- Seeding your printer config ---
# Put your files on this partition (the one holding kos.conf), in one of these layouts:
#
#   printer.cfg                      a single file, next to kos.conf
#   config/printer.cfg ...           your whole config folder, next to kos.conf
#   printer_data/config/printer.cfg  a full printer_data folder (config/, gcodes/, database/ ...)
#
# On the next boot it is copied into ~/printer_data and the source renamed *.imported.
# Paths under another home (/home/pi/..., /home/<you>/...) are rewritten to /home/klipper,
# and MCU serial/uuid values are matched to the boards actually plugged in.
