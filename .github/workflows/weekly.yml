name: weekly

# Bump build/pins.env to the latest upstream and commit it to main if tests pass. Then a second run of this workflow,
# started on main, builds both boards and publishes a weekly-YYYYMMDD prerelease, so the build and its provenance name
# the commit with the new pins. Builds even when no pin moved: Debian's own updates still land in the image.
on:
  schedule:
    - cron: '17 4 * * 1'   # Mondays 04:17 UTC
  workflow_dispatch:
    inputs:
      stage:
        description: 'bump: update the pins, then start a build run. build: build and publish main as it is'
        type: choice
        options: [bump, build]
        default: bump
      expect:
        description: commit the build run must be on (set by the bump run)
        type: string
        default: ''

permissions: {}

concurrency:
  group: weekly
  cancel-in-progress: false   # a running bump or build is never cut off by the next trigger

jobs:
  bump:
    if: inputs.stage != 'build'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      base: ${{ steps.bump.outputs.base }}
      changed: ${{ steps.bump.outputs.changed }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - id: bump
        run: |
          build/bump-pins.sh
          sh tests/run.sh
          {
              echo "base=$(git rev-parse HEAD)"
              echo "tag=weekly-$(date -u +%Y%m%d)"
              if git diff --quiet build/pins.env; then echo changed=false; else echo changed=true; fi
          } >> "$GITHUB_OUTPUT"
      - if: steps.bump.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: pins
          path: build/pins.env

  # Write access to main, nothing else; runs no repo code. The push fails (and nothing is published) if main moved
  # since the bump job tested it.
  commit:
    needs: bump
    if: needs.bump.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    # The push uses the KOS bot GitHub App's one-hour token, not GITHUB_TOKEN: the App is the only bypass actor on
    # main's ruleset (required checks), and its pushes trigger the tests workflow. Setup: CONTRIBUTING.md.
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          app-id: ${{ vars.KOS_BOT_APP_ID }}
          private-key: ${{ secrets.KOS_BOT_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.bump.outputs.base }}
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: pins
          path: build
      # Runs no repo code, so the allowlist is here, not in bump-pins.sh: comments and known KEY=value lines only.
      - name: check pins.env
        run: |
          if LC_ALL=C grep -nEvx '(#.*|(KLIPPER|MOONRAKER|MAINSAIL_CONFIG)_COMMIT=[0-9a-f]{40}|MAINSAIL_VERSION=v[0-9]+(\.[0-9]+)+|MAINSAIL_ZIP_SHA256=[0-9a-f]{64}|PIP_(MSGSPEC|UVLOOP)_VERSION=[0-9]+(\.[0-9]+)+|DEBIAN_IMAGE=debian:trixie@sha256:[0-9a-f]{64})?' build/pins.env; then
              echo "::error::build/pins.env has unexpected lines (above); not committed"
              exit 1
          fi
      - id: commit
        env:
          TAG: ${{ needs.bump.outputs.tag }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          bot_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git commit -m "build(pins): bump to latest upstream for $TAG" build/pins.env
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # Starts the build run on main: its commit (github.sha) is the one with the new pins, and the attestation names it.
  dispatch:
    needs: [bump, commit]
    if: ${{ !cancelled() && needs.bump.result == 'success' && needs.commit.result != 'failure' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXPECT: ${{ needs.commit.outputs.sha || needs.bump.outputs.base }}
        run: gh workflow run weekly.yml --ref main -f stage=build -f expect="$EXPECT"

  check:
    if: inputs.stage == 'build'
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - id: check
        env:
          EXPECT: ${{ inputs.expect }}
        run: |
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::weekly builds come from main only"; exit 1; }
          [ -z "$EXPECT" ] || [ "$EXPECT" = "$GITHUB_SHA" ] ||
              { echo "::error::main moved to $GITHUB_SHA after the bump run committed $EXPECT; not built"; exit 1; }
          echo "tag=weekly-$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ github.sha }}
      tag: ${{ needs.check.outputs.tag }}
      prerelease: true
